services:
  - type: web
    name: dualfetch-media-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:${PORT:-5000} --timeout 300 app:app
    envVars:
      - key: PORT
        value: 5000
      - key: YOUTUBE_COOKIES
        sync: false
      - key: COOKIE_FILE
        value: /etc/secrets/cookies.txt
